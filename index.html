<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Access</title>
<style id="shellStyle">
  :root { --bg:#f6f6f9; --card:#fff; --ink:#1b1b24; --muted:#6b6b7b; --line:#dcdce6; --acc:#5b4bff; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#13131a; --card:#1c1c26; --ink:#ececf4; --muted:#9a9aae; --line:#33333f; --bad:#f1796e; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  p { margin:0 0 16px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; } #err { color:var(--bad); font-size:14px; min-height:20px; margin-top:10px; }
</style>
<script src="static/config.js"></script>
</head>
<body>
<form class="card" id="f" hidden>
  <p>Enter the access password.</p>
  <label for="pw" hidden>Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Enter</button>
  <div id="err" role="alert"></div>
</form>
<script>
/* Public shell: the password card and a loader, nothing else. Everything of the app is fetched from the
   backend behind the access gate (header X-Demo-Access; same-origin also accepts the convenience cookie). */
(async () => {
  const B = (window.DEMO_BACKEND_URL || "").replace(/\/+$/, "");
  const NG = B ? { "ngrok-skip-browser-warning": "1" } : {};
  const KEY = "agentz_gate";
  const tok = () => { try { return sessionStorage.getItem(KEY); } catch (_e) { return null; } };
  const hdr = () => ({ ...NG, ...(tok() ? { "X-Demo-Access": tok() } : {}) });
  const $ = (id) => document.getElementById(id);

  async function authorized() {
    try { const d = await (await fetch(B + "/api/gate", { headers: hdr() })).json(); return !d.required || d.authorized; }
    catch (_e) { return null; }
  }
  function card() {
    $("f").hidden = false; $("pw").focus();
    return new Promise((done) => {
      $("f").onsubmit = async (e) => {
        e.preventDefault(); $("go").disabled = true; $("err").textContent = "";
        try {
          const r = await fetch(B + "/api/gate", { method: "POST", headers: { "Content-Type": "application/json", ...NG }, body: JSON.stringify({ password: $("pw").value }) });
          const d = await r.json().catch(() => ({}));
          if (r.ok) { if (d.token) { try { sessionStorage.setItem(KEY, d.token); } catch (_e) { /* cookie may still work */ } } $("f").hidden = true; done(); return; }
          $("err").textContent = d.error || "Could not sign in.";
        } catch (_e) { $("err").textContent = "Cannot reach the server."; }
        $("go").disabled = false;
      };
    });
  }
  const get = async (path) => { const r = await fetch(B + path, { headers: hdr() }); if (!r.ok) throw Object.assign(new Error(String(r.status)), { status: r.status }); return r.text(); };

  async function launch() {
    const html = await get("/app");
    const doc = new DOMParser().parseFromString(html, "text/html");
    // the page names its own gated assets (root-relative paths); fetch them with the access header
    const sheets = [...doc.querySelectorAll('link[rel=stylesheet][href^="/"]')];
    const scripts = [...doc.querySelectorAll("script[src^='/']")];
    const [css, js] = await Promise.all([Promise.all(sheets.map((l) => get(l.getAttribute("href")))), Promise.all(scripts.map((s) => get(s.getAttribute("src"))))]);
    sheets.forEach((l) => l.remove());
    document.title = doc.title;
    doc.head.querySelectorAll("link[rel=icon],link[rel=preconnect],link[rel=stylesheet]").forEach((l) => document.head.append(document.importNode(l, true)));
    const old = $("shellStyle"); if (old) old.remove();      // the card styles must not leak into the app
    css.forEach((text) => { const st = document.createElement("style"); st.textContent = text; document.head.append(st); });
    doc.body.querySelectorAll("script").forEach((s) => s.remove());
    document.body.replaceChildren(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));
    document.body.className = doc.body.className;
    js.forEach((text) => { const sc = document.createElement("script"); sc.textContent = text; document.body.append(sc); });
  }

  for (let attempt = 0; attempt < 3; attempt++) {
    const ok = await authorized();
    if (ok === null) { $("f").hidden = true; document.body.textContent = "Cannot reach the server."; return; }
    if (!ok) await card();
    try { await launch(); return; }
    catch (e) { if (e.status === 401) { try { sessionStorage.removeItem(KEY); } catch (_e) { /* ignore */ } continue; } document.body.textContent = "Could not load."; return; }
  }
})();
</script>
</body>
</html>
